appId: local.emma.darwin
productName: Emma Darwin
directories:
  buildResources: resources
  output: release/${version}
files:
  - 'out/main/**/*'
  - 'out/preload/**/*'
  - 'resources/**/*'
  - '!resources/Emma.iconset/**/*'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: resources/nori-glass.node
    to: nori-glass.node
  - from: resources/local-project.json
    to: local-project.json
  - from: resources/screen-ocr
    to: screen-ocr
asarUnpack:
  - resources/**
win:
  executableName: open-llm-vtuber-electron
  icon: resources/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  differentialPackage: false
mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.entertainment
  identity: null
  hardenedRuntime: false
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
  writeUpdateInfo: false
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  releaseType: release
  publishAutoUpdate: false
